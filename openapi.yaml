            properties:
                assignee:
                    type: string
                    description: 可空负责人。
                task:
                    type: string
                    description: 明确、可执行的任务描述。
                dueText:
                    type: string
                    description: 可空的原文期限；无法可靠解析时不转换为时间戳。
                status:
                    enum:
                        - MEETING_ACTION_ITEM_STATUS_UNSPECIFIED
                        - MEETING_ACTION_ITEM_STATUS_PENDING
                    type: string
                    description: 待办事项初始状态。
                    format: enum
            description: MeetingActionItem 是会议总结提取出的一个待办事项。
        meeting.v1.MeetingQuota:
            type: object
            properties:
                periodStart:
                    type: string
                    description: 当前自然月周期开始时间。
                    format: date-time
                periodEnd:
                    type: string
                    description: 当前自然月周期结束时间。
                    format: date-time
                limit:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 当前周期允许的音频总时长；为兼容旧客户端保留，值与 total_limit 相同。
                consumed:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 已最终结算的音频时长。
                reserved:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 已由活跃会议预占但尚未结算的音频时长。
                remaining:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 当前仍可预占的音频时长。
                maxMeetingDuration:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 单场会议硬上限。
                maxConcurrentMeetings:
                    type: integer
                    description: 单用户允许的活跃会议数。
                    format: int32
                activeMeetings:
                    type: integer
                    description: 当前活跃会议数。
                    format: int32
                baseLimit:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 当前周期从默认策略或用户覆盖配置快照得到的基础额度。
                purchasedLimit:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 当前周期已支付订单累计增加的额度。
                totalLimit:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 当前周期基础额度与购买额度之和。
            description: MeetingQuota 是当前用户在一个计费周期内的额度快照。
        meeting.v1.MeetingSummary:
            type: object
            properties:
                meetingId:
                    type: string
                    description: 会议 UUID。
                version:
                    type: string
                    description: 会议内严格递增的纪要版本。
                sourceTranscriptRevision:
                    type: string
                    description: 本纪要使用的最终转写快照版本。
                topic:
                    type: string
                    description: 简短会议主题。
                abstract:
                    type: string
                    description: 会议摘要。
                keyDiscussions:
                    type: array
                    items:
                        type: string
                    description: 关键讨论内容。
                decisions:
                    type: array
                    items:
                        type: string
                    description: 已达成的决定。
                actionItems:
                    type: array
                    items:
                        $ref: '#/components/schemas/meeting.v1.MeetingActionItem'
                    description: 会议待办事项。
                risks:
                    type: array
                    items:
                        type: string
                    description: 风险和待确认事项。
                modelName:
                    type: string
                    description: 实际生成该版本的模型名称。
                promptVersion:
                    type: string
                    description: 生成该版本的服务端 Prompt 版本。
                generatedAt:
                    type: string
                    description: 该纪要生成完成的时间。
                    format: date-time
                provider:
                    type: string
                    description: 实际处理该版本的 LLM Provider 标识。
                inputTokens:
                    type: string
                    description: Provider 报告的输入 token 数；不提供时为零。
                outputTokens:
                    type: string
                    description: Provider 报告的输出 token 数；不提供时为零。
            description: MeetingSummary 是经过服务端校验的版本化结构化会议纪要。
        meeting.v1.RegenerateMeetingSummaryRequest:
            required:
                - meetingId
            type: object
            properties:
                meetingId:
                    type: string
                    description: 当前用户拥有的会议 UUID。
            description: RegenerateMeetingSummaryRequest 是重新生成会议纪要的参数。
        meeting.v1.RegenerateMeetingSummaryResponse:
            type: object
            properties:
                status:
                    enum:
                        - MEETING_SUMMARY_STATUS_UNSPECIFIED
                        - MEETING_SUMMARY_STATUS_NOT_STARTED
                        - MEETING_SUMMARY_STATUS_PENDING
                        - MEETING_SUMMARY_STATUS_PROCESSING
                        - MEETING_SUMMARY_STATUS_SUCCEEDED
                        - MEETING_SUMMARY_STATUS_FAILED
                    type: string
                    description: 新任务的当前生成状态。
                    format: enum
                version:
                    type: string
                    description: 本次重新生成对应的纪要版本。
            description: RegenerateMeetingSummaryResponse 返回新创建或由幂等键命中的纪要任务。
        meeting.v1.StopMeetingRequest:
            required:
                - meetingId
            type: object
            properties:
                meetingId:
                    type: string
                    description: 当前用户拥有的会议 UUID。
            description: StopMeetingRequest 是停止会议参数。
        meeting.v1.StopMeetingResponse:
            type: object
            properties:
                meeting:
                    allOf:
                        - $ref: '#/components/schemas/meeting.v1.Meeting'
                    description: 最新会议状态；响应不承诺已经生成会议纪要。
            description: StopMeetingResponse 返回停止后的最新会议状态。
        meeting.v1.TranscriptSegment:
            type: object
            properties:
                segmentId:
                    type: string
                    description: vision-service 生成的稳定片段 ID。
                sequenceNo:
                    type: string
                    description: 会议内严格递增的最终片段序号。
                startOffset:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 片段相对会议音频的开始偏移。
                endOffset:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 片段相对会议音频的结束偏移。
                speakerLabel:
                    type: string
                    description: 可空的临时说话人标签；V1 不承诺真实身份。
                content:
                    type: string
                    description: 最终转写正文。
                language:
                    enum:
                        - MEETING_LANGUAGE_UNSPECIFIED
                        - MEETING_LANGUAGE_AUTO
                        - MEETING_LANGUAGE_ZH_CN
                        - MEETING_LANGUAGE_EN_US
                    type: string
                    description: 该片段识别出的语言。
                    format: enum
                confidence:
                    type: number
                    description: Provider 返回的置信度；Provider 不提供时为空。
                    format: float
                createdAt:
                    type: string
                    description: 最终片段生成时间。
                    format: date-time
            description: TranscriptSegment 是已经最终确认、可以持久化的转写片段。
        meeting.v1.TranscriptionSession:
            type: object
            properties:
                sessionId:
                    type: string
                    description: vision-service 转写会话 UUID。
                websocketUrl:
                    type: string
                    description: vision-service 的完整 WSS 地址，客户端不得自行拼接域名。
                sessionTicket:
                    type: string
                    description: 仅能消费一次的短期 ticket；不得写入日志或 URL query。
                expiresAt:
                    type: string
                    description: ticket 到期时间。
                    format: date-time
                audio:
                    allOf:
                        - $ref: '#/components/schemas/meeting.v1.AudioSpec'
                    description: 本次会话实际接受的实时音频约束。
                grantedAudioDuration:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: core-service 为本次 session 预占并授予的最大音频时长。
            description: TranscriptionSession 是 uTools 建立实时转写 WebSocket 所需的短期参数。
        user.v1.CheckInResponse:
            type: object
            properties:
                currentStreakDays:
                    type: integer
                    description: 包含今天在内的连续打卡天数。
                    format: int32
            description: 每日打卡结果。
        user.v1.FitnessProfile:
            type: object
            properties:
                userId:
                    type: string
                    description: 系统内部用户 UUID。
                goal:
                    type: string
                    description: 健身目标，例如增肌、减脂、塑形。
                experienceLevel:
                    type: string
                    description: 训练经验等级，例如 beginner、intermediate、advanced。
                daysPerWeek:
                    type: integer
                    description: 每周计划训练天数，范围 0 到 7。
                    format: int32
                durationMinutes:
                    type: integer
                    description: 单次计划训练分钟数，不能为负数。
                    format: int32
                availableEquipmentCodes:
                    type: array
                    items:
                        type: string
                    description: 用户可使用的器材编码列表。
                injuryNotes:
                    type: array
                    items:
                        type: string
                    description: 伤病或动作限制说明。
                onboardingCompleted:
                    type: boolean
                    description: 是否已完成首次健身档案引导。
            description: 用户健身目标和训练偏好。
        user.v1.GenerateWorkoutPlanResponse:
            type: object
            properties:
                plan:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.WorkoutPlan'
                    description: 新生成的训练计划。
            description: 生成训练计划结果。
        user.v1.GetFitnessProfileResponse:
            type: object
            properties:
                profile:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.FitnessProfile'
                    description: 用户健身档案。
            description: 查询健身档案结果。
        user.v1.GetWorkoutPlanResponse:
            type: object
            properties:
                plan:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.WorkoutPlan'
                    description: 指定的训练计划。
            description: 查询训练计划结果。
        user.v1.LoginRequest:
            required:
                - email
                - password
            type: object
            properties:
                email:
                    type: string
                    description: 注册时使用的邮箱；忽略首尾空格和大小写。
                password:
                    type: string
                    description: 登录密码。
                deviceId:
                    type: string
                    description: Web 端生成的设备标识，用于区分登录设备。
            description: Web 用户登录参数。
        user.v1.LoginResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: 调用业务接口使用的访问令牌。
                refreshToken:
                    type: string
                    description: 换取新访问令牌使用的刷新令牌。
                expiresInSeconds:
                    type: string
                    description: 访问令牌剩余有效秒数。
                user:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.User'
                    description: 当前登录用户。
                onboardingRequired:
                    type: boolean
                    description: 是否需要完成健身档案引导。
            description: Web 登录结果。
        user.v1.LogoutRequest:
            required:
                - refreshToken
            type: object
            properties:
                refreshToken:
                    type: string
                    description: 需要撤销的刷新令牌。
            description: 退出登录参数。
        user.v1.LogoutResponse:
            type: object
            properties: {}
            description: 退出登录结果，无响应字段。
        user.v1.RefreshTokenRequest:
            required:
                - refreshToken
            type: object
            properties:
                refreshToken:
                    type: string
                    description: 登录或上一次刷新返回的刷新令牌。
            description: 刷新令牌参数。
        user.v1.RefreshTokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: 新访问令牌。
                refreshToken:
                    type: string
                    description: 新刷新令牌，旧刷新令牌立即失效。
                expiresInSeconds:
                    type: string
                    description: 新访问令牌剩余有效秒数。
            description: 刷新令牌结果。
        user.v1.RegisterRequest:
            required:
                - email
                - password
            type: object
            properties:
                email:
                    type: string
                    description: 登录邮箱；忽略首尾空格和大小写，必须是完整的公网邮箱地址。
                password:
                    type: string
                    description: 登录密码，长度为 8 到 72 字节。
                nickname:
                    type: string
                    description: 用户展示昵称；为空时使用邮箱 @ 前的本地部分。
                deviceId:
                    type: string
                    description: Web 端生成的设备标识，用于区分登录设备。
            description: Web 用户注册参数。
        user.v1.RegisterResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: 调用业务接口使用的访问令牌。
                refreshToken:
                    type: string
                    description: 换取新访问令牌使用的刷新令牌。
                expiresInSeconds:
                    type: string
                    description: 访问令牌剩余有效秒数。
                user:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.User'
                    description: 当前登录用户。
                onboardingRequired:
                    type: boolean
                    description: 是否需要完成健身档案引导。
            description: Web 注册结果。
        user.v1.UToolsLoginRequest:
            required:
                - temporaryToken
            type: object
            properties:
                temporaryToken:
                    type: string
                    description: utools.fetchUserServerTemporaryToken 返回的一次性临时令牌。
                deviceId:
                    type: string
                    description: 插件侧生成并持久化在本机的非敏感设备标识。
            description: uTools 登录参数。
        user.v1.UToolsLoginResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: 调用业务接口使用的访问令牌。
                refreshToken:
                    type: string
                    description: 换取新访问令牌使用的刷新令牌。
                expiresInSeconds:
                    type: string
                    description: 访问令牌剩余有效秒数。
                user:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.User'
                    description: 当前登录用户。
                isNewUser:
                    type: boolean
                    description: 是否为该 uTools 用户首次登录。
                onboardingRequired:
                    type: boolean
                    description: 是否需要完成健身档案引导。
            description: uTools 登录结果。
        user.v1.UpdateFitnessProfileResponse:
            type: object
            properties:
                profile:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.FitnessProfile'
                    description: 更新后的用户健身档案。
            description: 更新健身档案结果。
        user.v1.User:
            type: object
            properties:
                userId:
                    type: string
                    description: 系统内部用户 UUID。
                nickname:
                    type: string
                    description: 用户展示昵称。
                avatarUri:
                    type: string
                    description: 用户头像资源地址。
                status:
                    type: string
                    description: 用户状态，例如 active、disabled。
            description: 用户基本信息。
        user.v1.WechatLoginRequest:
            required:
                - code
            type: object
            properties:
                code:
                    type: string
                    description: wx.login 返回的一次性临时凭证。
                deviceId:
                    type: string
                    description: 小程序侧生成的设备标识，用于区分登录设备。
            description: 微信登录参数。
        user.v1.WechatLoginResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: 调用业务接口使用的访问令牌。
                refreshToken:
                    type: string
                    description: 换取新访问令牌使用的刷新令牌。
                expiresInSeconds:
                    type: string
                    description: 访问令牌剩余有效秒数。
                user:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.User'
                    description: 当前登录用户。
                isNewUser:
                    type: boolean
                    description: 是否为该微信用户首次登录。
                onboardingRequired:
                    type: boolean
                    description: 是否需要完成健身档案引导。
            description: 微信登录结果。
        user.v1.WorkoutPlan:
            type: object
            properties:
                planId:
                    type: string
                    description: 训练计划 UUID。
                userId:
                    type: string
                    description: 计划所属用户 UUID。
                goal:
                    type: string
                    description: 生成计划时使用的健身目标。
                status:
                    type: string
                    description: 计划状态，例如 draft、active、completed、cancelled。
            description: 用户训练计划摘要。
        vision.v1.AnalysisJob:
            type: object
            properties:
                jobId:
                    type: string
                    description: 任务 UUID。
                type:
                    enum:
                        - ANALYSIS_TYPE_UNSPECIFIED
                        - ANALYSIS_TYPE_EQUIPMENT
                        - ANALYSIS_TYPE_POSTURE
                    type: string
                    description: 分析任务类型。
                    format: enum
                status:
                    enum:
                        - ANALYSIS_STATUS_UNSPECIFIED
                        - ANALYSIS_STATUS_PENDING
                        - ANALYSIS_STATUS_PROCESSING
                        - ANALYSIS_STATUS_SUCCEEDED
                        - ANALYSIS_STATUS_FAILED
                    type: string
                    description: 当前任务状态。
                    format: enum
                mediaUri:
                    type: string
                    description: 被分析的图片或视频地址。
                resultJson:
                    type: string
                    description: 成功后的结构化 JSON 结果；任务完成前为空。
                errorMessage:
                    type: string
                    description: 失败原因；任务未失败时为空。
            description: AI 异步分析任务。
        vision.v1.AnalyzePostureRequest:
            required:
                - videoUri
                - exerciseCode
                - userId
            type: object
            properties:
                videoUri:
                    type: string
                    description: 已上传视频的对象存储地址。
                exerciseCode:
                    type: string
                    description: 需要分析的标准动作编码。
                userId:
                    type: string
                    description: 发起任务的系统内部用户 UUID。
            description: 姿势分析参数。
        vision.v1.AnalyzePostureResponse:
            type: object
            properties:
                job:
                    allOf:
                        - $ref: '#/components/schemas/vision.v1.AnalysisJob'
                    description: 新创建的异步分析任务。
            description: 创建姿势分析任务结果。
        vision.v1.GetAnalysisJobResponse:
            type: object
            properties:
                job:
                    allOf:
                        - $ref: '#/components/schemas/vision.v1.AnalysisJob'
                    description: 当前分析任务。
            description: 查询分析任务结果。
        vision.v1.RecognizeEquipmentRequest:
            required:
                - imageUri
                - userId
            type: object
            properties:
                imageUri:
                    type: string
                    description: 已上传图片的对象存储地址。
                userId:
                    type: string
                    description: 发起任务的系统内部用户 UUID。
            description: 器材识别参数。
        vision.v1.RecognizeEquipmentResponse:
            type: object
            properties:
                job:
                    allOf:
                        - $ref: '#/components/schemas/vision.v1.AnalysisJob'
                    description: 新创建的异步分析任务。
            description: 创建器材识别任务结果。
tags:
    - name: ContentService
      description: ContentService 提供健身器材和教学动作内容查询能力。
    - name: MeetingService
      description: MeetingService 提供当前登录用户的会议控制、额度和最终转写查询能力。
    - name: UserService
      description: UserService 提供 Web/小程序登录、用户档案、训练计划和打卡能力。
    - name: VisionService
      description: VisionService 提供图片器材识别和视频姿势分析任务能力。
